[project]
name = "scout-mail"
version = "0.1.0"
description = "Zero-cost, local-first multi-agent job hunting automation system (resume-to-outreach) with human-in-the-loop approval."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "langgraph>=0.2.14",
    "langchain>=0.2.16",
    "langchain-community>=0.2.16",
    "chromadb>=0.5.5",
    "ollama>=0.3.3",
    "apscheduler>=3.10.4",
    "streamlit>=1.38.0",
    "requests>=2.32.3",
    "feedparser>=6.0.11",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.1",
    "python-docx>=1.1.2",
    "dnspython>=2.6.1",
    "python-whois>=0.9.4",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "ruff>=0.6.4",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"